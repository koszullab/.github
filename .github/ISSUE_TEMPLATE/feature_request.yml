name: Feature request
description: Something a tool should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want to do
      description: The question you are trying to answer, rather than the option you picture.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it now
      description: Another tool, a script, or not at all.
  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: >-
        A paper, a tool or a file format it should agree with, and public data to check it on.
